# Fly.io configuration for the MedStore backend (FastAPI + WeasyPrint).
# Usage (run from ./backend):
#   fly launch --no-deploy --copy-config   # first time; pick an app name/region
#   fly postgres create --name medstore-db # provision Postgres (or reuse one)
#   fly postgres attach medstore-db        # sets DATABASE_URL secret
#   fly secrets set JWT_SECRET=... CORS_ORIGINS=... (see deploy/DEPLOY.md)
#   fly deploy
#
# NOTE: change `app` to a globally-unique name before launching.

app = "medstore-backend"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  ENVIRONMENT = "production"
  DEBUG = "false"
  LOG_JSON = "true"
  LOG_LEVEL = "info"
  WEB_CONCURRENCY = "2"
  # Fly Postgres attach provides DATABASE_URL with the postgres:// scheme.
  # entrypoint.sh / config normalise it to the async (+asyncpg) driver.
  RUN_MIGRATIONS = "1"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
