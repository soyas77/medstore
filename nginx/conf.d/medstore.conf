# =============================================================================
# MedStore — server blocks
# Replace ${DOMAIN} occurrences with your domain, or render via envsubst.
# Routing:  /api/*  -> backend   |   /*  -> frontend (Next.js)
# =============================================================================

# ---- Shared security headers (applied per-location via `include`) ----
# Defined once here as a map-free snippet; referenced in each server block.

# ---------------------------------------------------------------------------
# HTTP :80
#   - Serves the ACME http-01 challenge for certbot
#   - Redirects everything else to HTTPS
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name medstore.example.com;   # <-- change to your domain

    # Let's Encrypt webroot challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------------------
# HTTPS :443
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name medstore.example.com;   # <-- change to your domain

    # ---- TLS ----
    ssl_certificate     /etc/letsencrypt/live/medstore.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/medstore.example.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/medstore.example.com/chain.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_timeout 1d;
    ssl_session_cache shared:MozSSL:10m;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    # ---- Security headers ----
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-XSS-Protection "1; mode=block" always;
    # CSP: tuned for Next.js (inline styles/scripts the framework injects).
    # Tighten 'unsafe-inline'/'unsafe-eval' with nonces if your app allows it.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    # ACME challenge still allowed over 443 path (harmless)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # ---- API -> backend ----
    location /api/ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # Websocket support (future-proofing for live updates)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Allow large CSV uploads on API routes
        client_max_body_size 10M;

        proxy_buffering off;       # stream PDF/file downloads promptly
    }

    # Backend health passthrough (optional convenience)
    location = /health {
        proxy_pass http://backend_upstream/health;
        access_log off;
    }

    # ---- Next.js static assets (long cache) ----
    location /_next/static/ {
        proxy_pass http://frontend_upstream;
        proxy_set_header Host $host;
        proxy_cache_valid 200 60m;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ---- Everything else -> frontend ----
    location / {
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Next.js HMR/websocket (dev) + RSC streaming
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
